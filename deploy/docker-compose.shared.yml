# Shared-server mode: use when another web server (Nginx/Apache/Traefik) already owns ports 80/443.
# Runs only db + app; app listens on 127.0.0.1:${APP_PORT:-4010}. Your existing web server proxies to it.
#   docker compose -f docker-compose.shared.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clelia
      POSTGRES_USER: clelia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clelia -d clelia"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: clelia-platform:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://clelia:${DB_PASSWORD}@db:5432/clelia
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      STORAGE_DIR: /data/storage
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cleliaandco.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Studio Admin}
      AI_IMAGES_PER_IP_PER_DAY: ${AI_IMAGES_PER_IP_PER_DAY:-30}
    volumes:
      - storage:/data/storage
    ports:
      - "127.0.0.1:${APP_PORT:-4010}:4000"

volumes:
  db:
  storage:
