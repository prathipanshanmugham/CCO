# /etc/nginx/sites-available/design.cleliaandco.com  — proxy to the Clelia app container.
# Enable:  ln -s /etc/nginx/sites-available/design.cleliaandco.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS:   certbot --nginx -d design.cleliaandco.com
server {
    listen 80;
    listen [::]:80;
    server_name design.cleliaandco.com;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
